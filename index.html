<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-bold-rounded/css/uicons-bold-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css">
  <style>
    :root,
    body[data-theme='light'] {
      --bg-page: #F5EBE1;
      --text-main: #2B1F12;
      --bg-header: #2B1F12;
      --text-header: #F5EBE1;
      --accent: #D4995E;
      --accent-hover: #896643;
      --border-main: #2B1F12;
      --card-bg: #F5EBE1;
      --note-bg: #D4995E;
      --note-hover: #896643;
      --note-text: #F5EBE1;
      --note-active-bg: #896643;
      --note-active-text: #F5EBE1;
      --note-active-border: #2B1F12;
      --toolbar-text: #D4995E;
    }

    body[data-theme='dark'] {
      --bg-page: #2B1F12;
      --text-main: #F5EBE1;
      --bg-header: #2B1F12;
      --text-header: #F5EBE1;
      --accent: #D4995E;
      --accent-hover: #896643;
      --border-main: #896643;
      --card-bg: #2B1F12;
      --note-bg: #896643;
      --note-hover: #D4995E;
      --note-text: #F5EBE1;
      --note-active-bg: #D4995E;
      --note-active-text: #2B1F12;
      --note-active-border: #F5EBE1;
      --toolbar-text: #F5EBE1;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    #appShell {
      background-color: var(--card-bg);
      border-color: var(--border-main);
    }

    #sidebarDrawer {
      background-color: var(--card-bg);
      color: var(--text-main);
      border-color: var(--border-main);
      transition: transform 0.25s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    #headerBar {
      background-color: var(--bg-header);
      color: var(--text-header);
    }

    #formattingBar {
      background-color: var(--bg-header);
      color: var(--toolbar-text);
      border-color: rgba(245, 235, 225, 0.18);
    }

    #notepad {
      background-color: var(--card-bg);
      color: var(--text-main);
      caret-color: var(--text-main);
      min-height: 300px;
    }

    #fontFamily,
    #fontSize {
      background-color: transparent;
      border-color: var(--accent);
      color: var(--toolbar-text);
    }

    #fontFamily option,
    #fontSize option {
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    #fontFamilyLabel,
    #fontSizeLabel,
    #wordCountWrap,
    #hamburgerBtn {
      color: var(--text-header);
    }

    #newNoteBtn,
    #saveBtn,
    #shareBtn {
      background-color: var(--accent);
      color: #ffffff;
      transition: background-color 0.15s ease;
    }

    #newNoteBtn:hover,
    #saveBtn:hover,
    #shareBtn:hover {
      background-color: var(--accent-hover);
    }

    .note-item {
      background-color: var(--note-bg);
      color: var(--note-text);
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .note-item:hover {
      background-color: var(--note-hover);
    }

    .note-item.active-note {
      background-color: var(--note-active-bg);
      color: var(--note-active-text);
      outline: 2px solid var(--note-active-border);
    }

    .note-delete {
      color: inherit;
    }

    #deleteModalBox,
    #saveModalBox,
    #shareModalBox {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 2px solid var(--border-main);
    }

    #deletePrompt,
    #savePrompt,
    #sharePrompt,
    #closeSave {
      color: var(--text-main);
    }

    #shareLink {
      background-color: var(--card-bg);
      color: var(--text-main);
      border-color: var(--accent);
    }

    #deleteYes {
      background-color: #dc2626;
      color: #ffffff;
      transition: background-color 0.15s ease;
    }

    #deleteYes:hover {
      background-color: #b91c1c;
    }

    #deleteNo,
    #saveTxt,
    #savePdf,
    #saveDocx,
    #copyLink,
    #closeShare {
      background-color: var(--accent);
      color: #ffffff;
      transition: background-color 0.15s ease;
    }

    #deleteNo:hover,
    #saveTxt:hover,
    #savePdf:hover,
    #saveDocx:hover,
    #copyLink:hover,
    #closeShare:hover {
      background-color: var(--accent-hover);
    }

    #themeToggleTrack {
      border-color: #896643;
      background: #D4995E;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    body[data-theme='dark'] #themeToggleTrack {
      background: linear-gradient(90deg, #2B1F12 0%, #896643 100%);
    }

    #themeToggleThumb {
      background: #F5EBE1;
      color: #2B1F12;
      transition: transform 0.25s ease;
    }

    body[data-theme='dark'] #themeToggleThumb {
      transform: translateX(1.4rem);
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(137, 102, 67, 0.4);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(137, 102, 67, 0.7);
    }
  </style>
</head>
<body id="pageBody" class="min-h-screen overflow-x-hidden flex flex-col">

  <!-- Mobile Drawer Backdrop Overlay -->
  <div id="drawerBackdrop" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden transition-opacity"></div>

  <!-- App Shell -->
  <div id="appShell" class="w-full md:w-[95%] max-w-6xl flex-1 min-h-screen md:min-h-[calc(100vh-4rem)] md:my-6 border-0 md:border-4 md:rounded-md mx-auto flex flex-col md:flex-row shadow-md overflow-hidden relative">

    <!-- Left Sidebar / Hamburger Drawer -->
    <aside id="sidebarDrawer" class="fixed md:static inset-y-0 left-0 z-50 w-72 md:w-64 -translate-x-full md:translate-x-0 flex flex-col border-r-2 border-inherit shrink-0 shadow-2xl md:shadow-none">
      
      <!-- Drawer Header -->
      <div class="p-3 sm:p-4 border-b-2 border-inherit flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fi fi-sr-disk text-lg"></i>
          <span class="font-bold text-lg tracking-wide select-none">Menu & Notes</span>
        </div>
        <button id="closeDrawerBtn" type="button" class="md:hidden text-2xl font-bold px-2 hover:opacity-75 cursor-pointer leading-none" aria-label="Close menu">&times;</button>
      </div>

      <!-- Action Buttons (New Note, Save / Export, Share) -->
      <div class="p-3 flex flex-col gap-2.5 border-b-2 border-inherit">
        <button id="newNoteBtn" type="button" class="w-full py-2.5 px-3 rounded font-bold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-xs" title="New Note">
          <i class="fi fi-br-square-plus text-base"></i>
          <span>New Note</span>
        </button>
        <button id="saveBtn" type="button" class="w-full py-2.5 px-3 rounded font-bold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-xs" title="Save / Export">
          <i class="fi fi-sr-disk text-base"></i>
          <span>Save / Export</span>
        </button>
        <button id="shareBtn" type="button" class="w-full py-2.5 px-3 rounded font-bold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-xs" title="Share Note">
          <span>Share Note</span>
        </button>
      </div>

      <!-- Notes List -->
      <div class="flex-1 min-h-0 flex flex-col p-3 overflow-hidden">
        <div class="flex items-center justify-between mb-2 px-1">
          <span class="font-bold text-xs uppercase tracking-wider opacity-75">All Notes</span>
          <span id="notesCountBadge" class="text-xs font-semibold opacity-75"></span>
        </div>
        <div id="notesList" class="flex-1 overflow-y-auto flex flex-col gap-1.5 pr-1"></div>
      </div>

    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 min-w-0 flex flex-col">

      <!-- Top Header Bar -->
      <header id="headerBar" class="border-b-2 border-inherit flex flex-col select-none">
        
        <!-- Primary Navbar: Hamburger, Logo, Word Count, Theme Toggle -->
        <div class="h-14 px-3 sm:px-4 flex items-center justify-between gap-2">
          
          <!-- Hamburger Menu Button -->
          <button id="hamburgerBtn" type="button" class="flex items-center justify-center p-2 rounded hover:opacity-80 cursor-pointer text-xl sm:text-2xl" aria-label="Toggle menu" title="Toggle menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>

          <!-- Logo -->
          <h1 class="font-bold font-mono tracking-wider text-xl sm:text-3xl text-center">NOTEPAD</h1>

          <!-- Right Controls: Words & Theme -->
          <div class="flex items-center gap-2.5 sm:gap-3">
            <div id="wordCountWrap" class="font-bold text-xs sm:text-base flex items-center gap-1">
              <span>Words:</span>
              <span id="wordCount">0</span>
            </div>

            <div id="themeToggleWrap" class="flex items-center">
              <label class="flex items-center cursor-pointer select-none" title="Toggle theme">
                <input id="themeToggle" type="checkbox" class="sr-only">
                <span id="themeToggleTrack" class="relative inline-flex h-6 sm:h-7 w-12 sm:w-14 items-center rounded-full border-2 cursor-pointer">
                  <span id="themeToggleThumb" class="inline-flex h-4 w-4 sm:h-5 sm:w-5 translate-x-1 items-center justify-center rounded-full text-[10px] sm:text-xs shadow-sm">☀</span>
                </span>
              </label>
            </div>
          </div>

        </div>

        <!-- Formatting Bar: Font & Size Selectors -->
        <div id="formattingBar" class="px-3 sm:px-4 py-1.5 flex items-center justify-center gap-3 sm:gap-5 text-xs sm:text-sm border-t border-inherit/20">
          <div class="flex items-center gap-1.5">
            <label id="fontFamilyLabel" for="fontFamily" class="font-bold text-xs sm:text-sm">Font:</label>
            <select id="fontFamily" class="border rounded px-2 py-0.5 text-xs sm:text-sm focus:outline-none cursor-pointer">
              <option value="monospace">Monospace</option>
              <option value="serif">Serif</option>
              <option value="sans-serif">Sans</option>
            </select>
          </div>

          <div class="w-px h-3.5 bg-inherit opacity-30"></div>

          <div class="flex items-center gap-1.5">
            <label id="fontSizeLabel" for="fontSize" class="font-bold text-xs sm:text-sm">Size:</label>
            <select id="fontSize" class="border rounded px-2 py-0.5 text-xs sm:text-sm focus:outline-none cursor-pointer">
              <option value="10">10</option>
              <option value="12">12</option>
              <option value="14" selected>14</option>
              <option value="18">18</option>
              <option value="24">24</option>
              <option value="32">32</option>
            </select>
          </div>
        </div>

      </header>

      <!-- Note Writing Box -->
      <main class="flex-1 flex flex-col p-3 sm:p-5 min-h-0">
        <textarea id="notepad" placeholder="Start writing..." class="w-full flex-1 border-none outline-none resize-none leading-relaxed text-sm sm:text-base p-1"></textarea>
      </main>

    </div>

  </div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
    <div id="deleteModalBox" class="p-5 sm:p-6 rounded-lg shadow-xl text-center w-full max-w-xs sm:max-w-sm">
      <p id="deletePrompt" class="mb-4 sm:mb-5 text-sm sm:text-lg font-semibold">Are you sure you want to delete this note?</p>
      <div class="flex gap-3 justify-center">
        <button id="deleteYes" class="px-5 py-2 rounded font-semibold cursor-pointer text-sm sm:text-base">Yes</button>
        <button id="deleteNo" class="px-5 py-2 rounded font-semibold cursor-pointer text-sm sm:text-base">No</button>
      </div>
    </div>
  </div>

  <!-- Save Modal -->
  <div id="saveModal" class="hidden fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
    <div id="saveModalBox" class="p-5 sm:p-6 rounded-lg shadow-xl relative w-full max-w-xs sm:max-w-sm">
      <button id="closeSave" class="absolute top-2 right-3 text-2xl font-bold hover:opacity-75 cursor-pointer leading-none" aria-label="Close save options">&times;</button>
      <p id="savePrompt" class="mb-4 text-sm sm:text-lg font-semibold">How do you want to save your note?</p>
      <div class="flex flex-col gap-2.5">
        <button id="saveTxt" class="py-2.5 px-4 rounded font-semibold cursor-pointer text-center text-sm sm:text-base">Text Document (.txt)</button>
        <button id="savePdf" class="py-2.5 px-4 rounded font-semibold cursor-pointer text-center text-sm sm:text-base">PDF Document (.pdf)</button>
        <button id="saveDocx" class="py-2.5 px-4 rounded font-semibold cursor-pointer text-center text-sm sm:text-base">Word Document (.docx)</button>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div id="shareModal" class="hidden fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
    <div id="shareModalBox" class="p-5 sm:p-6 rounded-lg shadow-xl w-full max-w-xs sm:max-w-md">
      <p id="sharePrompt" class="mb-3 text-sm sm:text-lg font-semibold">Share this note</p>
      <input type="text" id="shareLink" readonly class="w-full border px-3 py-2 rounded mb-4 text-xs sm:text-sm focus:outline-none" />
      <div class="flex gap-3">
        <button id="copyLink" class="flex-1 py-2 px-4 rounded font-semibold cursor-pointer text-sm sm:text-base">Copy Link</button>
        <button id="closeShare" class="py-2 px-4 rounded font-semibold cursor-pointer text-sm sm:text-base">Close</button>
      </div>
    </div>
  </div>

  <!-- Note Item Template -->
  <template id="noteTemplate">
    <div class="note-item p-2.5 rounded cursor-pointer flex justify-between items-center gap-2 w-full">
      <span class="note-title flex-1 truncate text-xs sm:text-sm font-medium"></span>
      <button type="button" class="note-delete font-bold text-base px-2 py-0.5 hover:opacity-75 cursor-pointer leading-none shrink-0" title="Delete note">✕</button>
    </div>
  </template>

  <!-- External Libraries (Original Stack) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
